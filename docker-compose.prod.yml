# Запуск готового образа из GitHub Container Registry.
#
#     docker compose -f docker-compose.prod.yml up -d
#
# ВАЖНО: не подменяет локальный docker-compose.yml — используется параллельно.
# Образ публикуется автоматически при каждом merge в main, см.
# .github/workflows/publish-image.yml.
#
# Заменить тег можно через переменную BOOKING_IMAGE:
#
#     BOOKING_IMAGE=ghcr.io/romatrooy/ait_repo2:6ce609a \
#       docker compose -f docker-compose.prod.yml up -d

services:
  booking:
    image: ${BOOKING_IMAGE:-ghcr.io/romatrooy/ait_repo2:latest}
    container_name: booking-reference
    ports:
      - '8000:8000'
    environment:
      BOOKING_DB_FILE: /data/booking.db
    volumes:
      # Именованный том: брони не теряются при пересоздании контейнера.
      - booking-data:/data
    # Сначала наполняем базу демонстрационными данными, потом запускаем сервис.
    # Скрипт наполнения идемпотентный: на непустой базе он ничего не меняет.
    command: sh -c "node server/dist/seed.js && node server/dist/index.js"
    restart: unless-stopped

volumes:
  booking-data:
